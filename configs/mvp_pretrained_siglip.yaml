model:
  hidden_dim: 768
  patch_size: 16
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 4
  momentum_tau: 0.996
  vision_backbone: vit_base_patch16_clip_224.openai
  text_backbone: distilbert-base-uncased
  freeze_encoders: true
  projection_dim: 512
  contrastive_loss: siglip
  contrastive_on_global: true

training:
  epochs: 50
  # Larger real micro-batch = more SigLIP in-batch negatives. Gradient
  # accumulation averages independent per-micro-batch sigmoid losses, so it does
  # NOT add negatives; only the true forward batch does. Effective batch stays
  # 256 (128 x 2) to keep the LR/EMA step horizon unchanged.
  batch_size: 128
  gradient_accumulation_steps: 2  # effective batch = 256, 4x more negatives/step
  learning_rate: 1.0e-4
  weight_decay: 0.1  # stronger regularization to counter overfitting
  warmup_steps: 500
  max_steps: null
  use_multi_crop: true
  global_crop_size: 224
  local_crop_size: 96
  phase_training: true
  gradient_checkpointing: true
  unfreeze_after_epoch: 5
  unfreeze_vision_blocks: 4
  encoder_unfreeze_lr: 2.0e-5  # gentler fine-tuning; overfitting began at unfreeze
  max_grad_norm: 1.0
  memory_bank_size: 0

loss:
  alpha: 0.1   # enable JEPA MSE prediction (regularizes the vision encoder)
  beta: 0.9    # contrastive
  gamma: 0.01
  label_smoothing: 0.05  # soften SigLIP +1/-1 targets to reduce overconfidence

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  batch_size: 128
  num_workers: 8
  prefetch_factor: 4
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 5

# OpenCLIP ViT-B/16 — robust retrieval fine-tuning. Breaks the 43% R@1 ceiling
# by attacking the *cause* of the peak-then-decline, not the hyperparameters.
#
# Evidence (experiments/exp_jepa_768d_16ep/metrics.json, the real v2 run):
#   * t2i R@1 peaks 43.2% @ epoch 3, decays to 40.1% @ epoch 15.
#   * Meanwhile train NCE@1 climbs 73% -> 93% AND the val SigLIP loss keeps
#     *decreasing* (26.3 -> 25.7) the whole time. So the contrastive loss is
#     anti-correlated with retrieval after epoch 3 — selecting the checkpoint
#     on val loss (the old default) saves the *most overfit* model.
#   This is textbook robustness loss when fine-tuning a zero-shot model.
#
# Fixes (all literature-grounded, all fit a single RTX 3090):
#   1. JEPA is the wrong objective for retrieval — it adds no cross-modal signal.
#      alpha (MSE) -> 0.0: pure contrastive alignment. (predictor/teacher idle.)
#   2. WiSE-FT (Wortsman et al., CVPR'22): evaluate/checkpoint the interpolation
#      of the zero-shot init and the fine-tuned weights. Recovers the robust
#      solution the fine-tune drifts away from. wise_ft_alpha 0.5.
#   3. Model-weight EMA: Polyak-average the weight trajectory so eval does not
#      chase late-epoch overfitting. model_ema_decay 0.999.
#   4. Select the best checkpoint on retrieval R@1, not val loss (done in the
#      training script now that R@1 and val loss diverge).
#   5. InfoNCE instead of SigLIP: for small-data fine-tuning softmax-CE gives
#      better contrastiveness than the sigmoid loss (open_clip #972, ITRA), and
#      it lets the MoCo-style memory bank inject thousands of extra negatives —
#      directly countering "the model only has to win a 128-way batch".
#   6. weight_decay 0.5 (SLIP/ITRA find CLIP fine-tuning wants large wd on
#      limited data; 0.1 was too weak a regularizer).
model:
  hidden_dim: 768
  patch_size: 16
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 4
  momentum_tau: 0.996
  vision_backbone: openclip
  text_backbone: openclip
  openclip_model: ViT-B-16
  openclip_pretrained: openai
  freeze_encoders: true
  projection_dim: 512
  projection_type: clip_residual   # CLIP-seeded linear + zero-init residual MLP
  text_pool: eot
  contrastive_loss: infonce        # softmax-CE > sigmoid for small-data finetune
  contrastive_on_global: true

training:
  epochs: 16
  batch_size: 256                  # 2x negatives vs v2; 3090 has ~20GB headroom
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.5                # strong regularization on limited data
  warmup_steps: 200
  unfreeze_after_epoch: 2
  unfreeze_vision_blocks: 6
  unfreeze_text_blocks: 6
  encoder_unfreeze_lr: 1.0e-5
  gradient_checkpointing: true
  max_grad_norm: 1.0
  memory_bank_size: 16384          # MoCo-style InfoNCE negatives beyond the batch
  # --- Robust fine-tuning (the core fix) ---
  use_model_ema: true
  model_ema_decay: 0.999
  wise_ft_alpha: 0.5               # 0=zero-shot, 1=fine-tuned; 0.5 = best-of-both

loss:
  alpha: 0.0     # drop JEPA MSE: it does nothing for retrieval
  beta: 1.0      # contrastive alignment is the whole objective
  gamma: 0.0
  label_smoothing: 0.0
  hard_negative_weight: 0.0
  hard_negative_margin: 0.2

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  num_workers: 4
  prefetch_factor: 2
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 4

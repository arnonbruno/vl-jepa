# VL-JEPA default training configuration

model:
  hidden_dim: 768
  patch_size: 16
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 6
  momentum_tau: 0.996

training:
  epochs: 15
  batch_size: 32
  learning_rate: 1.5e-4
  weight_decay: 0.05
  warmup_steps: 2000
  max_steps: null  # auto: epochs * (samples // batch_size)
  use_multi_crop: true
  global_crop_size: 224
  local_crop_size: 96

loss:
  alpha: 1.0
  beta: 1.0

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  batch_size: 32
  num_workers: 4
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 5

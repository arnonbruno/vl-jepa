# OpenCLIP ViT-B/16 end-to-end, starting from CLIP's *aligned* embedding space.
#
# Root cause of the 25-26% R@1 plateau (shared with the two prior runs): the
# model discarded CLIP's pretrained cross-modal alignment and relearned it from
# scratch on 118K COCO images, capping near CLIP's *un-aligned* feature quality.
# Two bugs caused this:
#   1. Text was mean-pooled over a causal transformer. CLIP's text embedding
#      lives in the EOT token (the only position that attends to the whole
#      sentence). -> text_pool: eot
#   2. The 768->512 / 512->512 projections were randomly-initialized MLPs,
#      throwing away CLIP's native visual.proj / text_projection matrices (the
#      heads trained on 400M pairs). -> projection_type: clip
#
# With both fixes the joint space *starts* at CLIP zero-shot quality (~30%+ t2i
# R@1) and fine-tunes upward, instead of relearning alignment from zero.
#
# Secondary changes vs openclip_vitb16.yaml:
#   - hard_negative_weight 0.2 -> 0.0: with a well-aligned space the VSE++ hinge
#     mostly injected competing gradient noise. Re-enable (e.g. 0.05) once the
#     aligned baseline is established if top-1 sharpening is still needed.
#   - unfreeze_vision_blocks 4 -> 6 and unfreeze_after_epoch 5 -> 2: the
#     projection no longer needs a long warmup, so adapt the encoder sooner and
#     give it more capacity. encoder_unfreeze_lr stays gentle to protect CLIP.
#   - learning_rate 1e-4 -> 5e-5: CLIP-seeded projections fine-tune at the base
#     LR (the trainer auto-drops the 10x proj LR for projection_type=clip), so a
#     gentler base avoids drifting away from the pretrained alignment.
model:
  hidden_dim: 768
  patch_size: 16
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 4
  momentum_tau: 0.996
  vision_backbone: openclip
  text_backbone: openclip
  openclip_model: ViT-B-16
  openclip_pretrained: openai
  freeze_encoders: true
  projection_dim: 512
  projection_type: clip   # seed joint projection from CLIP's native proj matrices
  text_pool: eot          # pool the CLIP EOT token, not a mean over tokens
  contrastive_loss: siglip
  contrastive_on_global: true

training:
  epochs: 50
  batch_size: 128
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  weight_decay: 0.1
  warmup_steps: 200
  unfreeze_after_epoch: 2
  unfreeze_vision_blocks: 6
  encoder_unfreeze_lr: 1.0e-5
  gradient_checkpointing: true
  max_grad_norm: 1.0

loss:
  alpha: 0.05   # light JEPA MSE regularization on the vision encoder
  beta: 1.0     # contrastive alignment dominates
  gamma: 0.0    # no collapse risk: aligned start + frozen-then-gentle encoder
  label_smoothing: 0.05
  hard_negative_weight: 0.0
  hard_negative_margin: 0.2

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  batch_size: 128
  num_workers: 8
  prefetch_factor: 4
  # CLIP's text context length is 77; COCO captions fit comfortably in 64.
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 5

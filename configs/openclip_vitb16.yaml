model:
  hidden_dim: 768
  patch_size: 16
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 4
  momentum_tau: 0.996
  vision_backbone: openclip
  text_backbone: openclip
  openclip_model: ViT-B-16
  openclip_pretrained: openai
  freeze_encoders: true
  projection_dim: 512
  contrastive_loss: siglip
  contrastive_on_global: true

training:
  epochs: 50
  batch_size: 128
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  weight_decay: 0.1
  warmup_steps: 500
  unfreeze_after_epoch: 5
  unfreeze_vision_blocks: 4
  encoder_unfreeze_lr: 2.0e-5
  max_grad_norm: 1.0

loss:
  alpha: 0.1
  beta: 0.9
  gamma: 0.01
  label_smoothing: 0.05

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  batch_size: 128
  num_workers: 8
  prefetch_factor: 4
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 5

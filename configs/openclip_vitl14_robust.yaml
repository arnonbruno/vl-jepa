# OpenCLIP ViT-L/14 — robust retrieval fine-tuning to break the ViT-B/16 ceiling.
#
# Rationale (see RESULTS.md): under the *standard* COCO 5K protocol the robust
# ViT-B/16 recipe already beats CLIP ViT-B/16 zero-shot (rsum 393.1 vs 356.9).
# The remaining headroom is encoder capacity: CLIP ViT-L/14 zero-shot starts
# from a much stronger representation, so the same robust recipe on top of it is
# the highest-leverage path to higher absolute recall on a single RTX 3090.
#
# Memory plan for 24GB: ViT-L/14 is ~2x ViT-B params with 256 patches (vs 196).
# Gradient checkpointing + batch 64 keeps activation memory in budget; the
# encoders stay frozen for the first 2 epochs (only projections train) and then
# a small tail of blocks unfreezes at a low LR. Inherits every robustness fix
# from the ViT-B/16 run: WiSE-FT, model EMA, InfoNCE, R@1 checkpoint selection.
model:
  hidden_dim: 1024                 # ViT-L visual width (overridden by the tower)
  patch_size: 14
  image_size: 224
  mask_ratio: 0.75
  text_mask_ratio: 0.0
  predictor_layers: 4
  momentum_tau: 0.996
  vision_backbone: openclip
  text_backbone: openclip
  openclip_model: ViT-L-14
  openclip_pretrained: openai
  freeze_encoders: true
  projection_dim: 768              # ViT-L/14 shared embed dim (auto-aligned)
  projection_type: clip_residual
  text_pool: eot
  contrastive_loss: infonce
  contrastive_on_global: true

training:
  epochs: 16
  batch_size: 64                   # ViT-L activations are ~2x ViT-B; 64 fits 24GB
  gradient_accumulation_steps: 4   # effective batch 256, matching the ViT-B run
  learning_rate: 4.0e-5
  weight_decay: 0.5
  warmup_steps: 200
  unfreeze_after_epoch: 2
  unfreeze_vision_blocks: 4
  unfreeze_text_blocks: 4
  encoder_unfreeze_lr: 8.0e-6      # lower than ViT-B: bigger tower drifts faster
  gradient_checkpointing: true
  max_grad_norm: 1.0
  memory_bank_size: 16384
  use_model_ema: true
  model_ema_decay: 0.999
  wise_ft_alpha: 0.5

loss:
  alpha: 0.0
  beta: 1.0
  gamma: 0.0
  label_smoothing: 0.0
  hard_negative_weight: 0.0
  hard_negative_margin: 0.2

data:
  coco_root: ~/.cache/torch/hub/checkpoints
  image_size: 224
  num_workers: 4
  prefetch_factor: 2
  max_caption_length: 64

output:
  output_dir: experiments
  log_interval: 10
  checkpoint_interval: 4

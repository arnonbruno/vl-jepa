[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vl-jepa"
version = "0.2.0"
description = "Vision-Language Joint Embedding Predictive Architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.13.0",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "pycocotools>=2.0.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
